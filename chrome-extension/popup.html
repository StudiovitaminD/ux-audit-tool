<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UX Audit Capture</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <main class="panel">
      <div class="panel-header">
        <div>
          <h1>UX Audit Capture</h1>
          <p>Capture the pages you want to include in your audit.</p>
        </div>
      </div>

      <section class="card">
        <h2>Capture a page</h2>
        <p>Open the page you want to audit, then capture the complete page.</p>
        <button id="capturePage" class="button" type="button">Capture full page</button>
      </section>

      <section class="card">
        <div class="row-between">
          <div>
            <h2>Captures</h2>
            <p id="captureCount">0 pages captured</p>
          </div>
          <button id="clearCaptures" class="button button-ghost" type="button">Clear</button>
        </div>
        <div class="actions">
          <button id="sendCaptures" class="button" type="button">Send to audit form</button>
        </div>
        <div id="capturesList" class="capture-list empty">No captures yet.</div>
      </section>

      <p id="flashMessage" class="flash" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
